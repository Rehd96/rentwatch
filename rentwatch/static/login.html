<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>rentwatch · accesso</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36;
    --fg: #e8eaf0; --muted: #8b93a7; --accent: #4f9cf9; --error: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8; --card: #fff; --line: #e2e5ec;
      --fg: #1a1d24; --muted: #6b7280; --accent: #2563eb; --error: #dc2626;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); padding: 1.5rem;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 22rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 1.75rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.25rem; letter-spacing: -.01em; }
  p.sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .875rem; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
  input {
    width: 100%; padding: .6rem .7rem; margin-bottom: 1rem; font: inherit;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: .65rem; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    background: color-mix(in srgb, var(--error) 12%, transparent);
    border: 1px solid var(--error); color: var(--error);
    padding: .55rem .7rem; border-radius: 8px; font-size: .85rem;
    margin-bottom: 1rem;
  }
  .error:empty { display: none; }
</style>
</head>
<body>
  <form class="card" method="post" action="__BASE__login">
    <h1>rentwatch</h1>
    <p class="sub">Affitti Torino — accesso riservato</p>

    <div class="error">__ERROR__</div>

    <label for="username">Utente</label>
    <input id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">Entra</button>
  </form>
</body>
</html>
