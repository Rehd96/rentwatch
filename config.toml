# rentwatch configuration — committed example.
#
# config.local.toml (gitignored) overrides this file entirely and is what the
# dashboard settings page writes. Secrets — password hash, bot token — belong
# there, never here.

db_path = "data/rentwatch.db"

# Seconds to wait between page requests (min, max) — keep polite.
request_delay = [1.5, 3.0]

[auth]
# The dashboard shows addresses, prices and the flats you liked, so it asks for
# a password. Turning this off is only reasonable on a laptop nothing else can
# reach.
enabled = true
secret_key = ""        # blank -> generated once into data/session_secret

# One [[auth.users]] block per person. Never write them here by hand: the
# hashes belong in config.local.toml, which is gitignored.
#
#   python -m rentwatch set-password --username ion      # add, or change a password
#   python -m rentwatch list-users                       # who can log in
#   python -m rentwatch remove-user --username ospite
#
# [[auth.users]]
# username = "ion"
# password_hash = "pbkdf2_sha256$260000$...$..."
#
# Configs written before multi-user had `username` and `password_hash` directly
# under [auth]; those still load and are folded into the list automatically.

[schedule]
# What the systemd timer is set to. Changing this line does not move the timer;
# edit deploy/rentwatch-scrape.timer and `systemctl daemon-reload`.
every_hours = 4

[telegram]
# Create a bot with @BotFather for the token; @userinfobot gives you the chat
# id. Easiest from the dashboard: /settings, then "invia messaggio di prova".
enabled = false
bot_token = ""
chat_id = ""
max_per_run = 20

# Nothing is sent between these hours (local time). Matches found inside the
# window are queued, not dropped, and go out with the first run after it.
quiet_hours_start = 23
quiet_hours_end = 8

notify_price_drops = true
send_run_summary = false

# Placeholders: {title} {price} {surface} {ppm2} {rooms} {floor}
#               {zone} {address} {agency} {url} {old_price} {delta}
template = "🏠 {title}\n💶 {price} · {surface}{ppm2}\n📍 {zone}\n{url}"

[telegram.filters]
# Which listings are worth a message. Separate from the search below: the
# dashboard keeps showing everything, the phone only buzzes for these.
price_min = 0
price_max = 0            # 0 = no limit
surface_min = 0
rooms_min = 0
zones = []               # macrozone names; empty = all
exclude_agencies = false
skip_suspect = true      # drop the per-room "student price" listings

# One or more saved searches. Params are the same query parameters
# immobiliare.it uses in its own URLs. Useful ones:
#   prezzoMinimo / prezzoMassimo   price range (€/month)
#   superficieMinima               minimum surface (m²)
#   localiMinimo / localiMassimo   number of rooms ("locali")
#   idMZona[]                      macrozone ids (repeatable)
# Location defaults to Torino city; override via [searches.params] if needed.
[[searches]]
name = "Torino - affitti fino a 1000€, min 40 m²"
path = "/affitto-case/torino/"

[searches.params]
prezzoMassimo = 1000
superficieMinima = 40
# localiMinimo = 2
